<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Aubergine background -->
  <circle cx="50" cy="50" r="48" fill="#1a1322"/>

  <!-- Decorative dashed ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#9d87b5" stroke-width="0.6" stroke-dasharray="0.5 4" opacity="0.55"/>

  <!-- Crescent moon (light circle minus offset cutout) -->
  <mask id="fav-moon">
    <rect width="100" height="100" fill="white"/>
    <circle cx="62" cy="42" r="28" fill="black"/>
  </mask>
  <circle cx="50" cy="50" r="32" fill="#f5e8d4" mask="url(#fav-moon)"/>

  <!-- Crater detail -->
  <circle cx="38" cy="48" r="2.2" fill="#9d87b5" opacity="0.55" mask="url(#fav-moon)"/>
  <circle cx="33" cy="62" r="1.4" fill="#9d87b5" opacity="0.45" mask="url(#fav-moon)"/>

  <!-- Star sparkle accent -->
  <path d="M76,72 L77,69 L78,72 L81,73 L78,74 L77,77 L76,74 L73,73 Z" fill="#c8b6d6" opacity="0.8"/>
</svg>
