<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background gradient (aubergine → plum) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d3045"/>
      <stop offset="50%" stop-color="#2a2032"/>
      <stop offset="100%" stop-color="#1a1322"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#9d87b5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9d87b5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Crescent moon decoration -->
  <g transform="translate(950, 175)" opacity="0.65">
    <!-- Dashed outer orbital ring -->
    <circle cx="0" cy="0" r="105" fill="none" stroke="#c8b6d6" stroke-width="0.8" stroke-dasharray="0.5 8" opacity="0.55"/>
    <!-- Thin inner ring -->
    <circle cx="0" cy="0" r="96" fill="none" stroke="#c8b6d6" stroke-width="0.4" opacity="0.35"/>
    <!-- Main moon disc -->
    <circle cx="0" cy="0" r="78" fill="#f5e8d4"/>
    <!-- Cutout to form the crescent (matches the gradient region beneath) -->
    <circle cx="22" cy="-14" r="70" fill="#2a2032"/>
    <!-- Craters on the visible crescent (left side only — won't overlap the cutout) -->
    <circle cx="-32" cy="-22" r="3.5" fill="#9d87b5" opacity="0.55"/>
    <circle cx="-48" cy="4" r="2.6" fill="#9d87b5" opacity="0.5"/>
    <circle cx="-38" cy="32" r="3" fill="#9d87b5" opacity="0.5"/>
    <circle cx="-18" cy="52" r="2.2" fill="#9d87b5" opacity="0.45"/>
    <circle cx="-55" cy="20" r="1.8" fill="#9d87b5" opacity="0.4"/>
  </g>

  <!-- Stars -->
  <g fill="#c8b6d6" opacity="0.6">
    <text x="180" y="160" font-family="Georgia, serif" font-size="22">✦</text>
    <text x="280" y="450" font-family="Georgia, serif" font-size="16">✧</text>
    <text x="900" y="520" font-family="Georgia, serif" font-size="20">✦</text>
    <text x="1050" y="380" font-family="Georgia, serif" font-size="14">✧</text>
  </g>

  <!-- Brand text -->
  <text x="600" y="290" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="120" font-weight="300" fill="#f5e8d4" letter-spacing="-2">
    Tsuki Mel
  </text>
  <text x="600" y="380" text-anchor="middle" font-family="'Brush Script MT', 'Lucida Handwriting', cursive" font-style="italic" font-size="72" fill="#c8b6d6">
    Tattoo
  </text>

  <!-- Divider -->
  <line x1="500" y1="430" x2="700" y2="430" stroke="#9d87b5" stroke-width="1" opacity="0.6"/>

  <!-- Subtitle -->
  <text x="600" y="475" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#c8b6d6" letter-spacing="6">
    CUSTOM TATTOO ARTIST
  </text>
  <text x="600" y="510" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#f5e8d4" opacity="0.7" letter-spacing="4">
    LEITH · EDINBURGH
  </text>
</svg>
